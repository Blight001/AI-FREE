<!DOCTYPE html>
<html class="ai-control-page">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http: https:; frame-src http: https:; child-src http: https:; object-src 'none'; base-uri 'self'">
  <title>AI 控制</title>
  <script>
    (function initThemeClass() {
      try {
        const savedTheme = localStorage.getItem('ai-free.control-panel.theme');
        if (savedTheme !== 'dark' && savedTheme !== 'gold') {
          localStorage.setItem('ai-free.control-panel.theme', 'light');
          document.documentElement.classList.add('theme-light');
        } else if (savedTheme === 'light') {
          document.documentElement.classList.add('theme-light');
        } else if (savedTheme === 'gold') {
          document.documentElement.classList.add('theme-gold');
        }
      } catch (_) {}
    })();
  </script>
  <script src="./client/scripts/ui-scale.js"></script>
  <link rel="stylesheet" href="./client/styles/control-panel.css" />
  <link rel="stylesheet" href="./client/app/side/styles/side.css" />
  <link rel="stylesheet" href="./client/app/side/styles/modules/ai-control-files.css" />
  <link rel="stylesheet" href="./client/app/side/styles/modules/ai-control-browser-target.css" />
  <link rel="stylesheet" href="./client/app/side/styles/modules/website-console-theme.css" />
</head>
<body>
  <div class="control-shell">
    <div class="main-wrapper">

      <section id="ai-control-panel" class="ai-control-panel panel active" aria-label="AI 控制">
        <header class="ai-chat-header">
          <div class="ai-chat-select-field ai-chat-history-field">
            <label for="ai-chat-history-trigger">对话</label>
            <div class="ai-select" data-ai-select="history" id="ai-chat-history-select">
              <button type="button" class="ai-select-trigger" id="ai-chat-history-trigger" aria-haspopup="listbox" aria-expanded="false" aria-label="选择历史对话">
                <span class="ai-select-value" id="ai-chat-history-value">新对话</span>
                <span class="ai-select-chevron" aria-hidden="true"></span>
              </button>
              <ul class="ai-select-menu ai-chat-history-menu" id="ai-chat-history-menu" role="listbox" hidden></ul>
            </div>
            <button type="button" class="ai-chat-new-conversation" id="ai-chat-new-conversation" aria-label="新建对话">
              <span class="ai-chat-new-conversation-icon" aria-hidden="true">+</span>新建对话
            </button>
            <label class="ai-chat-stream-toggle" title="逐步显示 AI 生成内容">
              <input id="ai-chat-stream-output" type="checkbox" checked>
              <span>流式</span>
            </label>
          </div>
        </header>
        <div class="ai-chat-body">
          <div id="ai-chat-messages" class="ai-chat-messages" role="log" aria-live="polite">
            <div class="ai-chat-welcome">
              <div class="ai-chat-welcome-hero">
                <span class="ai-chat-welcome-logo"><img class="ai-chat-welcome-icon" data-app-logo alt="" aria-hidden="true"></span>
                <strong>今天想一起完成什么？</strong>
                <p>直接描述你的目标即可。</p>
              </div>
            </div>
          </div>
        </div>
        <form id="ai-chat-form" class="ai-chat-composer">
          <div id="ai-chat-attachment-chips" class="ai-chat-attachment-chips" hidden></div>
          <div id="ai-chat-workspace-panel" class="ai-chat-workspace-panel" hidden>
            <header>
              <div class="ai-chat-workspace-heading">
                <strong>工作文件</strong>
                <span>桌面 / AI-Workspace</span>
              </div>
              <div class="ai-chat-workspace-actions">
                <button id="ai-chat-workspace-upload" class="is-primary" type="button">＋ 导入</button>
                <button id="ai-chat-workspace-refresh" class="is-icon" type="button" aria-label="刷新" title="刷新文件列表">↻</button>
                <button id="ai-chat-workspace-close" class="is-icon" type="button" aria-label="关闭" title="关闭">×</button>
              </div>
            </header>
            <div id="ai-chat-workspace-files" class="ai-chat-workspace-files"></div>
          </div>
          <section id="ai-chat-upload-confirmation" class="ai-chat-confirmation" aria-label="上传确认" hidden>
            <div id="ai-chat-confirmation-summary" role="status"></div>
            <div class="ai-chat-confirmation-actions">
              <button id="ai-chat-confirmation-cancel" type="button">取消</button>
              <button id="ai-chat-confirmation-accept" type="button">确认上传</button>
            </div>
          </section>
          <div id="ai-chat-mention-menu" class="ai-chat-mention-menu" role="listbox" hidden></div>
          <textarea id="ai-chat-input" rows="1" maxlength="12000" placeholder="输入消息，@ 引用工具或文件，Enter 发送"></textarea>
          <div class="ai-chat-footer-bar">
            <div class="ai-chat-footer-left">
              <button id="ai-chat-attach" class="ai-chat-attach" type="button" aria-label="添加文件" title="上传或选择 AI-Workspace 文件">+</button>
            </div>
            <div class="ai-chat-footer-right">
              <div id="ai-chat-quota" class="ai-chat-quota-widget" title="选择模型后即可开始对话">
                <div class="ai-chat-quota-ring" id="ai-chat-quota-ring" style="--quota-progress: 0%;">
                  <div class="ai-chat-quota-ring-fill"></div>
                  <span id="ai-chat-quota-value" class="ai-chat-quota-value">--</span>
                </div>
              </div>
              <div class="ai-chat-select-field ai-chat-model-field">
                <div class="ai-select ai-select-sm ai-select-dropup ai-model-inline-select" data-ai-select="model">
                  <select id="ai-chat-model" class="ai-select-native" disabled tabindex="-1" aria-hidden="true">
                    <option value="">正在读取可用模型...</option>
                  </select>
                  <button type="button" class="ai-select-trigger" id="ai-chat-model-trigger" aria-haspopup="listbox" aria-expanded="false" disabled aria-label="选择模型">
                    <span class="ai-select-value">正在读取可用模型...</span>
                    <span class="ai-select-chevron" aria-hidden="true"></span>
                  </button>
                  <ul class="ai-select-menu" role="listbox" hidden></ul>
                </div>
              </div>
              <button id="ai-chat-send" type="submit" disabled aria-label="发送消息"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg></button>
            </div>
          </div>
        </form>
        <section id="ai-chat-workspace-preview" class="ai-chat-workspace-preview" role="dialog" aria-modal="true" aria-labelledby="ai-chat-workspace-preview-title" hidden>
          <button class="ai-chat-workspace-preview-backdrop" type="button" data-workspace-preview-close aria-label="关闭文件预览"></button>
          <div class="ai-chat-workspace-preview-dialog">
            <header>
              <div class="ai-chat-workspace-preview-heading">
                <strong id="ai-chat-workspace-preview-title">文件预览</strong>
                <span id="ai-chat-workspace-preview-meta"></span>
              </div>
              <button id="ai-chat-workspace-preview-close" class="ai-chat-workspace-preview-close" type="button" aria-label="关闭文件预览" title="关闭">×</button>
            </header>
            <div id="ai-chat-workspace-preview-body" class="ai-chat-workspace-preview-body"></div>
          </div>
        </section>
      </section>

    </div>
  </div>


  <script src="../../shared/app-assets.js"></script>
  <script src="./client/scripts/logo-assets.js"></script>
  <script src="./client/scripts/control-panel.js"></script>
  <script src="./client/app/side/controllers/shared/sidebar-resizer.js"></script>

  <script src="../../shared/quota-display.js"></script>
  <script src="./client/app/side/controllers/pages/ai-control.js"></script>
  <script src="./client/app/side/controllers/pages/ai-control/ai-control-selection.js"></script>
  <script src="./client/app/side/controllers/pages/ai-control/ai-control-selectors.js"></script>
  <script src="./client/app/side/controllers/pages/ai-control/ai-control-card-selector.js"></script>
  <script src="./client/app/side/controllers/pages/ai-control/ai-control-history-list.js"></script>
  <script src="./client/app/side/controllers/pages/ai-control/ai-control-history-session.js"></script>
  <script src="./client/app/side/controllers/pages/ai-control/ai-control-markdown.js"></script>
  <script src="./client/app/side/controllers/pages/ai-control/ai-control-tool-card.js"></script>
  <script src="./client/app/side/controllers/pages/ai-control/ai-control-tool-display.js"></script>
  <script src="./client/app/side/controllers/pages/ai-control/ai-control-messages.js"></script>
  <script src="./client/app/side/controllers/pages/ai-control/ai-control-data-loaders.js"></script>
  <script src="./client/app/side/controllers/pages/ai-control/ai-control-files.js"></script>
  <script src="./client/app/side/controllers/pages/ai-control/ai-control-browser-target.js"></script>
  <script src="./client/app/side/controllers/pages/ai-control/ai-control-composer.js"></script>
  <script src="./client/app/side/controllers/pages/ai-control/ai-control-bootstrap.js"></script>

  <!-- 共享控制器工具 -->
  <script src="../renderer/controllers/shared/controller-utils.js"></script>
  <script src="../../shared/version-utils.js"></script>
  <script src="../../shared/message-utils.js"></script>
  <script src="../../shared/server-message-utils.js"></script>
  <script src="../../shared/text-preview-utils.js"></script>

  <!-- 消息弹窗模块 -->
  <script src="./client/app/side/controllers/shared/message-modal.js"></script>
  <script src="./client/app/side/controllers/shared/message-modal-server.js"></script>
  <script src="./client/app/side/controllers/shared/message-modal-dialogs.js"></script>

  <script src="./client/app/side/controllers/pages/side-panel/modules/sidebar-input-routing.js"></script>
</body>
</html>
