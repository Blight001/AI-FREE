<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenCut · AI-FREE</title>
  <link rel="icon" href="./favicon.ico">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <strong>OpenCut</strong>
        <span id="status-url">正在连接本地端口…</span>
      </div>
    </div>
    <div class="meta">
      <span id="ffmpeg-status">ffmpeg 检测中</span>
      <span id="project-status">未打开工程</span>
    </div>
  </header>
  <main class="workspace">
    <aside class="panel">
      <h2>工程</h2>
      <form id="create-form" class="row">
        <input id="project-name" placeholder="新工程名" required>
        <button type="submit">新建</button>
      </form>
      <ul id="project-list" class="list"></ul>
    </aside>
    <section class="timeline-wrap">
      <h2>时间线</h2>
      <div id="timeline" class="timeline empty">还没有打开的工程</div>
    </section>
    <aside class="panel">
      <h2>素材</h2>
      <form id="import-form" class="stack">
        <input id="media-path" placeholder="本机路径或 AI-Workspace 相对路径">
        <button type="submit">导入</button>
      </form>
      <ul id="media-list" class="list"></ul>
    </aside>
  </main>
  <footer class="tools">
    <p>AI 可通过 <code>opencut.*</code> 工具管理工程、剪辑和导出。本页与 MCP 共用同一份工程库。</p>
    <div id="tool-names"></div>
  </footer>
  <script src="./app.js"></script>
</body>
</html>
